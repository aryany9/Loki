name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release Artifacts
        run: ./gradlew assembleRelease bundleRelease

      - name: Prepare & Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          
          # 1. Package Android App Bundle (AAB)
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "app/build/outputs/bundle/release/app-release.aab" "release-artifacts/Loki-${TAG_NAME}.aab"
          fi

          # 2. Package & Sign APK (arm64-v8a)
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEY_ALIAS_PASSWORD" ]; then
            echo "Keystore secrets detected. Signing release APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "$KEYSTORE_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_ALIAS_PASSWORD" \
              --out "release-artifacts/Loki-${TAG_NAME}-arm64-v8a.apk" \
              "app/build/outputs/apk/release/app-release-unsigned.apk"
            
            rm -f release.keystore
          else
            echo "Keystore secrets not configured. Falling back to debug-signed APK for installability..."
            ./gradlew :app:assembleDebug
            cp "app/build/outputs/apk/debug/app-debug.apk" "release-artifacts/Loki-${TAG_NAME}-arm64-v8a.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
